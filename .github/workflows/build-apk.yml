name: Build SHIT MART APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q SHIT_MART_Android_v2.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix JVM target
        run: |
          cd project

          python3 - <<'PY'
          import os
          import re

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file in ("build.gradle", "build.gradle.kts"):
                      path = os.path.join(root, file)

                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      text = text.replace(
                          "JavaVersion.VERSION_1_8",
                          "JavaVersion.VERSION_17"
                      )

                      text = text.replace(
                          "JvmTarget.JVM_1_8",
                          "JvmTarget.JVM_17"
                      )

                      text = re.sub(
                          r'jvmTarget\s*=\s*["\']1\.8["\']',
                          'jvmTarget = "17"',
                          text
                      )

                      text = re.sub(
                          r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_1_8',
                          'sourceCompatibility = JavaVersion.VERSION_17',
                          text
                      )

                      text = re.sub(
                          r'targetCompatibility\s*=\s*JavaVersion\.VERSION_1_8',
                          'targetCompatibility = JavaVersion.VERSION_17',
                          text
                      )

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

                      print("Fixed:", path)
          PY

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          echo "SETTINGS=$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIT-MART-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
